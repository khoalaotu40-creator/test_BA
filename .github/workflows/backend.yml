name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/backend.yml'
      - 'workflow/backend.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  test-and-compile:
    name: Backend Lint & Server Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck Backend Server
        run: npx tsc --noEmit

      - name: Compile Backend Server (esbuild bundle)
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs

      - name: Verify compiled server syntax
        run: node -c dist/server.cjs

      - name: Upload backend server bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-server-dist
          path: dist/server.cjs
          retention-days: 7
